name: Dyno Therapeutics
description: 'Dyno Therapeutics is an AI-driven biotechnology company in Watertown, Massachusetts
  that combines machine learning with high-throughput in vivo experimentation to engineer
  adeno-associated virus (AAV) vectors for gene therapy. Its CapsidMap platform designs novel AAV
  capsids optimized for tissue targeting, immune evasion, manufacturability, and payload packaging,
  advanced through partnerships with pharmaceutical companies. Dyno also open-sources protein-design
  tooling for the research community, including the dyno-phi CLI for its Phi protein-design platform
  and the Psi-1 de novo binder-design model.'
